
name: Update Jio Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'



jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------
      # STEP 1: CHECKOUT
      # --------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------
      # STEP 2: PREPARE FOLDER
      # --------------------------------------------
      - name: Prepare sources folder
        run: mkdir -p sources

      # --------------------------------------------
      # STEP 3: DOWNLOAD SOURCE
      # --------------------------------------------
      - name: Download Jio playlist
        env:
          SRC_JTV: ${{ secrets.SRC_JTV }}
        run: |
          set -e
          wget -q -O sources/jio_raw.m3u "$SRC_JTV"

      # --------------------------------------------
      # STEP 4: FILTER PLAYLIST
      #         + APPLY 4 BLACKLIST CATEGORIES
      #         + ENSURE HEADER + BLANK LINE
      # --------------------------------------------
      - name: Clean playlist
        run: |
          {
            echo "#EXTM3U"
            echo
            awk '
            BEGIN { IGNORECASE=1; keep=0 }

            # ============================================
            # BLACKLIST CATEGORY 1 language
            # ============================================
            function blacklist_1(line) {
              return (line ~ /test|malaya|tamil|telugu|kannada|odia|gujarat|bengali|bangla|assamese|french|bhojpuri|nepali|k mar|go mar|nic mar|k HD+ Mar|test/)
            }

            # ============================================
            # BLACKLIST CATEGORY 2 nework
            # ============================================
            function blacklist_2(line) {
              return (line ~ /test|STREAMX|test/)
            }

            # ============================================
            # BLACKLIST CATEGORY 3 region
            # ============================================
            function blacklist_3(line) {
              return (line ~ /test|test/)
            }

            # ============================================
            # BLACKLIST CATEGORY 4 other
            # ============================================
            function blacklist_4(line) {
              return (line ~ /test|bajar|bazaar|test/)
            }

            # ============================================
            # GROUP-TITLE REPLACEMENT
            # ============================================
            function replace_group_title(line) {

              # DEMO LINE 1
              gsub(/group-title="Business News"/, "group-title=\"News\"", line)

              # DEMO LINE 2 - CHANGE AS REQUIRED
              gsub(/group-title="Educational"/, "group-title=\"Infotainment\"", line)

              return line
            }

            # ============================================
            # CHANNEL-SPECIFIC GROUP-TITLE REPLACEMENT
            # ============================================
            function replace_channel_group(line) {

              # working line
              if (line ~ /Sony Marathi/)
                sub(/group-title="Marathi"/, "group-title=\"Entertainment\"", line)
                if (line ~ /9x Jhakaas/)
                sub(/group-title="Marathi"/, "group-title=\"Music\"", line)
                if (line ~ /ABP Majha/)
                sub(/group-title="Marathi"/, "group-title=\"News\"", line)
                if (line ~ /Colors Marathi/)
                sub(/group-title="Marathi"/, "group-title=\"Entertainment\"", line)
                if (line ~ /Colors Marathi HD/)
                sub(/group-title="Marathi"/, "group-title=\"Entertainment\"", line)
                if (line ~ /DD Sahayadri/)
                sub(/group-title="Marathi"/, "group-title=\"Entertainment\"", line)
                if (line ~ /Gomantak TV/)
                sub(/group-title="Marathi"/, "group-title=\"News\"", line)
                if (line ~ /Jai Maharashtra/)
                sub(/group-title="Marathi"/, "group-title=\"News\"", line)
                if (line ~ /Lokshahi News/)
                sub(/group-title="Marathi"/, "group-title=\"News\"", line)
                if (line ~ /NDTV Marathi/)
                sub(/group-title="Marathi"/, "group-title=\"News\"", line)
                if (line ~ /News18 Marathi/)
                sub(/group-title="Marathi"/, "group-title=\"News\"", line)
                if (line ~ /News Marathi 24x7/)
                sub(/group-title="Marathi"/, "group-title=\"News\"", line)
                if (line ~ /Pudhari News/)
                sub(/group-title="Marathi"/, "group-title=\"News\"", line)
                if (line ~ /Saam Tv/)
                sub(/group-title="Marathi"/, "group-title=\"News\"", line)
                if (line ~ /Sangeet Marathi/)
                sub(/group-title="Marathi"/, "group-title=\"Music\"", line)
                if (line ~ /Shemaroo MarathiBana/)
                sub(/group-title="Marathi"/, "group-title=\"Entertainment\"", line)
                if (line ~ /Star Pravah/)
                sub(/group-title="Marathi"/, "group-title=\"Entertainment\"", line)
                if (line ~ /Star Pravah HD/)
                sub(/group-title="Marathi"/, "group-title=\"Entertainment\"", line)
                if (line ~ /Star Pravah Picture/)
                sub(/group-title="Marathi"/, "group-title=\"Movies\"", line)
                if (line ~ /Star Pravah Picture HD/)
                sub(/group-title="Marathi"/, "group-title=\"Movies\"", line)
                if (line ~ /Sun Marathi/)
                sub(/group-title="Marathi"/, "group-title=\"Entertainment\"", line)
                if (line ~ /Times of Maharashtra/)
                sub(/group-title="Marathi"/, "group-title=\"News\"", line)
                if (line ~ /Top News Marathi/)
                sub(/group-title="Marathi"/, "group-title=\"News\"", line)
                if (line ~ /TV9 Maharashtra/)
                sub(/group-title="Marathi"/, "group-title=\"News\"", line)
                if (line ~ /Zee 24 Taas/)
                sub(/group-title="Marathi"/, "group-title=\"News\"", line)
                if (line ~ /Zee Marathi/)
                sub(/group-title="Marathi"/, "group-title=\"Entertainment\"", line)
                if (line ~ /Zee Marathi HD/)
                sub(/group-title="Marathi"/, "group-title=\"Entertainment\"", line)
                if (line ~ /Zee Yuva/)
                sub(/group-title="Marathi"/, "group-title=\"Entertainment\"", line)
                if (line ~ /Zee Talkies/)
                sub(/group-title="Marathi"/, "group-title=\"Movies\"", line)
                if (line ~ /Zee Talkies HD/)
                sub(/group-title="Marathi"/, "group-title=\"Movies\"", line)
                
              # DEMO LINE 2 - CHANGE AS REQUIRED
              # if (line ~ /CHANNEL NAME/)
              #   sub(/group-title="OLD GROUP"/, "group-title=\"NEW GROUP\"", line)

              return line
            }

            # ============================================
            # COMBINED BLACKLIST
            # ============================================
            function is_blocked(line) {
              return (blacklist_1(line) || blacklist_2(line) || blacklist_3(line) || blacklist_4(line))
            }

            # ============================================
            # PROCESS CHANNELS
            # ============================================
            /^#EXTINF/ {

              $0 = replace_group_title($0)
              $0 = replace_channel_group($0)

              if (is_blocked($0)) {
                keep=0
              } else {
                keep=1
                print
              }

              next
            }

            { if (keep==1) print }
            ' sources/jio_raw.m3u
          } > sources/jio.stream

          rm -f sources/jio_raw.m3u

      # --------------------------------------------
      # STEP 5: COMMIT
      # --------------------------------------------
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sources/jio.stream
          git commit -m "Update Jio playlist (jio.stream)" || echo "No changes"
          git push
