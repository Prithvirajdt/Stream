name: Update Jio Playlist

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------
      # STEP 1: CHECKOUT
      # --------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------
      # STEP 2: PREPARE FOLDER
      # --------------------------------------------
      - name: Prepare sources folder
        run: mkdir -p sources

      # --------------------------------------------
      # STEP 3: DOWNLOAD SOURCE
      # --------------------------------------------
      - name: Download Jio playlist
        env:
          SRC_JTV: ${{ secrets.SRC_JTV }}
        run: |
          set -e
          wget -q -O sources/jio_raw.m3u "$SRC_JTV"

      # --------------------------------------------
      # STEP 4: FILTER PLAYLIST
      #         + ONLY JIO GROUP-TITLE CHANNELS
      #         + APPLY 4 BLACKLIST CATEGORIES
      #         + ENSURE HEADER + BLANK LINE
      # --------------------------------------------
      - name: Clean playlist
        run: |
          {
            echo "#EXTM3U"
            echo
            awk '
            BEGIN { IGNORECASE=1; keep=0 }

            # ============================================
            # BLACKLIST CATEGORY 1
            # ============================================
            function blacklist_1(line) {
              return (line ~ /test|test/)
            }

            # ============================================
            # BLACKLIST CATEGORY 2
            # ============================================
            function blacklist_2(line) {
              return (line ~ /test|test/)
            }

            # ============================================
            # BLACKLIST CATEGORY 3
            # ============================================
            function blacklist_3(line) {
              return (line ~ /test|test/)
            }

            # ============================================
            # BLACKLIST CATEGORY 4
            # ============================================
            function blacklist_4(line) {
              return (line ~ /test|test/)
            }

            # ============================================
            # COMBINED BLACKLIST
            # ============================================
            function is_blocked(line) {
              return (blacklist_1(line) || blacklist_2(line) || blacklist_3(line) || blacklist_4(line))
            }

            # ============================================
            # PROCESS CHANNELS
            # ============================================
            /^#EXTINF/ {

              # Keep ONLY channels whose group-title contains "jio"
              if ($0 ~ /group-title="[^"]*jio[^"]*"/) {

                if (is_blocked($0)) {
                  keep=0
                } else {
                  keep=1
                  print
                }

              } else {
                keep=0
              }

              next
            }

            { if (keep==1) print }
            ' sources/jio_raw.m3u
          } > sources/jio.stream

          rm -f sources/jio_raw.m3u

      # --------------------------------------------
      # STEP 5: COMMIT
      # --------------------------------------------
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sources/jio.stream
          git commit -m "Update Jio playlist (jio.stream)" || echo "No changes"
          git push
